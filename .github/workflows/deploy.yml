name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '169.58.43.192' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH einrichten
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "Secret DEPLOY_SSH_KEY fehlt" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Projektverzeichnis auf dem Server ermitteln
        id: target
        run: |
          # Reihenfolge: Repo-Variable DEPLOY_PATH, dann das Verzeichnis eines
          # laufenden Containers aus compose.yaml, sonst /opt/<repo-name>.
          dir="$DEPLOY_PATH"
          if [ -z "$dir" ]; then
            for name in $(grep -hoE '^\s*container_name:\s*\S+' compose.y*ml docker-compose.y*ml 2>/dev/null | awk '{print $2}' | tr -d '"'"'"'); do
              dir=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
                "docker inspect $name --format '{{ index .Config.Labels \"com.docker.compose.project.working_dir\" }}' 2>/dev/null" || true)
              [ -n "$dir" ] && break
            done
          fi
          dir=${dir:-/opt/${GITHUB_REPOSITORY#*/}}
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$dir'"
          echo "Zielverzeichnis: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Dateien übertragen
        run: |
          rsync -az --delete --exclude .git --exclude .github --exclude .env \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:${{ steps.target.outputs.dir }}/"

      - name: Container neu bauen und starten
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '${{ steps.target.outputs.dir }}' && docker compose up -d --build && docker image prune -f"
